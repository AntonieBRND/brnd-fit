function weekStreakInfo(u = S.me) {
  const goal = profile(u).weekly || 3; const days = [...new Set(activityOf(u).map((w) => w.date))];
  const cnt = (start) => days.filter((d) => { const t = parseDate(d); return t >= start && t < start + 7 * DAY; }).length;
  let best = 0, run = 0; const first = days.length ? Math.min(...days.map(parseDate)) : Date.now();
  for (let st = weekStart(first); st <= weekStart(Date.now()); st += 7 * DAY) { if (cnt(st) >= goal) { run++; best = Math.max(best, run); } else if (st < weekStart(Date.now())) run = 0; }
  return { cur: streakWeeks(u), best, total: days.length, goal, days: new Set(days) };
}

async function finishWorkout() {

    if (!prev.length) continue;
    const best = Math.max(...prev.map((h) => h.e1)); const now = Math.max(...e.sets.map((s) => setScore(s, e.kind)));
    if (now > best + 0.01) prs.push({ id: e.id, name: e.name, value: Math.round(now * 10) / 10 });
  }

  const fixed = draft.manual || draft.editing;
  const dur = fixed ? (num(draft.dur) ?? (old ? durMin(old) : draft.noTimer ? Math.max(30, ex.length * 10) : Math.round(ex.reduce((a, e) => a + e.sets.length, 0) * 2.6))) : Math.round(elapsed() / 60000);

  go('done', {}, { replace: true });
}

function sleepStats(u = S.me) {
  const days = lastDays(14).map((d) => ({ d, m: sleepOf(u, d) })); const w = days.slice(7).filter((x) => x.m);
  if (!w.length) return null;
  const avg = w.reduce((a, x) => a + x.m, 0) / w.length; const goal = sleepGoal(u);
  const sd = Math.sqrt(w.reduce((a, x) => a + (x.m - avg) ** 2, 0) / w.length);
  const h = avg / 60;
  const verdict = h < 6 ? ['Te weinig', 'bad', 'Volwassenen hebben 7 tot 9 uur slaap nodig. Met minder dan 6 uur herstellen je spieren slechter en wordt sterker worden lastiger.']
    : h < 7 ? ['Iets te weinig', 'warn', 'Je zit net onder de gezonde 7 tot 9 uur. Een half uur eerder naar bed maakt al verschil voor je herstel.']
    : h <= 9.2 ? ['Gezond', 'good', 'Je slaapt binnen de gezonde 7 tot 9 uur. Precies goed voor spierherstel en energie.']
    : ['Veel', 'warn', 'Je slaapt meer dan 9 uur. Prima na zware weken; slaap je structureel zoveel en ben je toch moe, let er dan op.'];
  const extra = [];
  if (avg < goal - 20) extra.push(`Je haalt je doel van ${hmin(goal)} gemiddeld ${hmin(goal - avg)} niet.`);
  if (sd > 60) extra.push('Je slaap wisselt veel per nacht; een vast ritme helpt bij herstel.');
  return { days, avg, goal, sd, verdict, extra };
}
function stepStats(u = S.me) {

  if (!w.length) return null;
  const avg = w.reduce((a, x) => a + x.v, 0) / w.length;
  const verdict = avg < 5000 ? ['Weinig beweging', 'bad', 'Onder de 5.000 stappen per dag beweeg je weinig. Een wandeling van 20 minuten is al zo’n 2.500 stappen extra.']
    : avg < 7500 ? ['Redelijk', 'warn', 'Je zit tussen 5.000 en 7.500 stappen. Voor je gezondheid is 7.500 tot 10.000 per dag ideaal.']
    : avg < 10000 ? ['Goed', 'good', 'Mooi, je zit in de gezonde zone van 7.500 tot 10.000 stappen.']
    : ['Top', 'good', 'Meer dan 10.000 stappen per dag, top voor je conditie en extra verbranding.'];
  const kcal = days.slice(7).reduce((a, x) => a + stepKcal(u, x.d), 0);
  return { days, avg, goal, verdict, kcal };
}
function statusOf(u = S.me) {
  const p = profile(u); const ws = weekStart(Date.now());
  const days = new Set(activityOf(u).filter((w) => parseDate(w.date) >= ws).map((w) => w.date)).size;
  const parts = [{ k: 'Training', v: Math.min(1, days / (p.weekly || 3)), w: 0.4, d: `${days} van ${p.weekly || 3} deze week` }];
  const R = recovery(u, todayStr()); if (R) parts.push({ k: 'Herstel', v: R.score / 100, w: 0.35, d: R.last ? `${hmin(R.last)} geslapen` : 'op basis van je slaap' });
  const st = stepStats(u); if (st) parts.push({ k: 'Beweging', v: Math.min(1, st.avg / st.goal), w: 0.25, d: `gem. ${nf(Math.round(st.avg / 100) / 10, 1)}k stappen` });
  const tw = parts.reduce((a, x) => a + x.w, 0);
  const score = Math.round((parts.reduce((a, x) => a + x.v * x.w, 0) / tw) * 100);
  const label = score >= 80 ? 'Topvorm' : score >= 60 ? 'Goed bezig' : score >= 40 ? 'Op weg' : 'Opbouwen';
  return { score, label, parts, R };
}

function prRows(u) {
  const used = new Set(workoutsOf(u).flatMap((w) => (w.ex || []).map((e) => e.id))); const rows = [];
  for (const id of used) {
    const h = exHistory(u, id); if (!h.length) continue;
    const e = exById(id) || { name: h[0]?.name || id, kind: 'kg' };
    let best = null; for (const x of h) for (const s of x.sets) { const sc = setScore(s, x.kind); if (!best || sc > best.sc) best = { sc, s, date: x.date, kind: x.kind }; }
    rows.push({ e, best, gain: h[0].e1 ? (best.sc / h[0].e1 - 1) * 100 : 0, n: h.length });
  }
  return rows.sort((a, b) => b.n - a.n);
}

// ---------- Sheets ----------
function renderSheet() {
  const root = $('#sheet-root');
  if (!S.sheet) { root.innerHTML = ''; return; }
  if (S.sheet.type === 'ex') { renderExSheet(); return; }
  const head = (t) => `<div class="sheet-head"><div class="row" style="justify-content:space-between"><h2>${t}</h2><button class="iconbtn" data-act="sheet-close" aria-label="Sluiten">${IC.x}</button></div></div>`;
  let title = '', body = '';
  if (S.sheet.type === 'plus') {
    const npl = nextPlanFor(S.me); const nt = npl ? tplById(npl.tpl) : null;
    title = 'Nieuwe training';
    body = `<div class="eyebrow">Nu trainen</div>${draft ? `<button class="pick" data-act="resume"><span><b>Hervat je training</b><br><small>${esc(tplById(draft.tpl)?.short || 'Eigen')} · ${draft.ex.length} ${draft.ex.length === 1 ? 'oefening' : 'oefeningen'}</small></span>${IC.chev.replace('<svg', '<svg width="18" height="18" style="stroke:var(--muted);fill:none;stroke-width:2"')}</button>
      <button class="btn danger" data-act="discard" data-confirm>Training annuleren</button>` : `
      ${nt ? `<button class="pick" data-act="start" data-tpl="${nt.id}" data-time="${npl.time}"><span><b>${nt.sport ? 'Log' : 'Start'} ${esc(nt.short)}</b><br><small>Gepland: ${relDay(npl.date).toLowerCase()} om ${npl.time}</small></span><span class="pr">Volgende</span></button>` : ''}
      ${allTpl().filter((t) => t.id !== nt?.id && t.cat === 'split').map((t) => `<button class="pick" data-act="start" data-tpl="${t.id}"><span><b>${esc(t.short)}</b><br><small>${esc(t.name)}</small></span></button>`).join('')}
      <button class="pick" data-act="go" data-r="muscles"><span><b>Kies doelspieren</b><br><small>Stel zelf een training samen</small></span></button>
      <button class="pick" data-act="start" data-tpl=""><span><b>Lege training</b><br><small>Oefeningen kies je onderweg</small></span></button>`}
      <div class="eyebrow grp-title">Loggen of inplannen</div>
      <button class="pick" data-act="add-open" data-k="fitness"><span><b>Fitness</b><br><small>Al gedaan, of voor later vastzetten</small></span><span class="pick-ic">${IC.dumbbell}</span></button>
      <button class="pick" data-act="add-open" data-k="padel"><span><b>Padel</b><br><small>Al gespeeld, of een potje inplannen</small></span><span class="pick-ic">${PADEL_ICON}</span></button>`;
  } else if (S.sheet.type === 'sessmenu') {
    title = 'Training';
    body = `<div class="f"><span>Met wie</span>${partnerSeg(draft.partner || '', 'partner', draft.user || S.me)}</div>
      <div class="grid2"><label class="f">Datum<input class="in" type="date" data-draft="date" max="${todayStr()}" value="${draft.date}"></label><label class="f">Duur (min)<input class="in num" inputmode="numeric" data-draft="dur" placeholder="${Math.max(30, draft.ex.length * 10)}" value="${esc(draft.dur || '')}"></label></div>
      <label class="f">Calorieën<input class="in num" inputmode="numeric" data-draft="kcal" placeholder="automatisch" value="${esc(draft.kcal || '')}"></label>
      <label class="f">Notitie<textarea class="in" data-draft="note" placeholder="Hoe ging het?">${esc(draft.note || '')}</textarea></label>
      <button class="pbtn danger" data-act="${draft.editing ? 'edit-cancel' : 'discard'}" data-confirm>${draft.editing ? 'Stop zonder opslaan' : 'Training weggooien'}</button>`;
  } else if (S.sheet.type === 'exmenu') {
    title = 'Opties';
    body = `<button class="pick" data-act="pick-ex"><b>Oefening toevoegen</b></button>
      <button class="pick" data-act="swap-ex"><b>Deze oefening vervangen</b></button>
      <button class="pick" data-act="ex-del"><b>Deze oefening verwijderen</b></button>
      ${draft?.manual || draft?.editing ? `<div class="grid2" style="margin-top:6px"><label class="f">Duur (min)<input class="in num" id="d-dur" inputmode="numeric" data-draft="dur" value="${esc(draft.dur ?? '')}"></label><label class="f">Calorieën<input class="in num" id="d-kcal" inputmode="numeric" data-draft="kcal" placeholder="automatisch" value="${esc(draft.kcal ?? '')}"></label></div>` : ''}
      <label class="f" style="margin-top:6px">Notitie bij deze training<textarea class="in" id="d-note" data-draft="note">${esc(draft?.note || '')}</textarea></label>
      <button class="pick" data-act="finish"><b>Training nu afronden</b></button>
      <button class="btn danger" data-act="discard" data-confirm>${draft?.editing ? 'Stop met bewerken' : 'Training weggooien'}</button>`;
  } else if (S.sheet.type === 'menu') {
    title = 'Menu';
    body = `<button class="pick" data-act="go" data-r="profile"><span class="row">${faceHtml(userOf(S.me), 36)}<span><b>${esc(userOf(S.me).name)}</b><br><small>Profiel, doelen en instellingen</small></span></span>${IC.chev.replace('<svg', '<svg width="18" height="18" style="stroke:var(--muted);fill:none;stroke-width:2"')}</button>
      <button class="pick" data-act="go" data-r="body"><b>Lichaam &amp; metingen</b></button>
      <button class="pick" data-act="switch-user"><span class="row">${dotu(other())}<b>Wissel naar ${esc(other().name)}</b></span></button>`;
  } else if (S.sheet.type === 'day') {
    title = 'Kies een dag';
    body = Array.from({ length: 7 }, (_, i) => dateKey(parseDate(todayStr()) - i * DAY)).map((d) => { const n = activityOf().filter((w) => w.date === d).length;
      return `<button class="pick" data-act="day-set" data-d="${d}" aria-pressed="${(S.day || todayStr()) === d}"><b>${d === todayStr() ? 'Vandaag' : relDay(d)}</b><small>${n ? n + ' training' + (n > 1 ? 'en' : '') : 'geen training'}${stepsOf(S.me, d) ? ' · ' + nf(stepsOf(S.me, d), 0) + ' stappen' : ''}</small></button>`; }).join('');
  } else if (S.sheet.type === 'steps') {
    const d = S.day || todayStr(); title = 'Stappen ' + (d === todayStr() ? 'vandaag' : relDay(d).toLowerCase());
    body = `<label class="f">Aantal stappen<input class="in num" id="steps-in" inputmode="numeric" value="${stepsOf(S.me, d) || ''}" placeholder="bijv. 8500"></label>
      <p class="muted small" style="margin:0">Neem het getal over van je telefoon of horloge. Doel: ${nf(profile().stepGoal || 10000, 0)} stappen.</p>
      <button class="btn cta wide plain" data-act="steps-save">Opslaan</button>`;
  } else if (S.sheet.type === 'sleep') {
    const d = S.day || todayStr(); const h = healthOf(S.me, d) || {}; const sc = sleepSched(); title = 'Slaap afgelopen nacht';
    body = `<div class="grid2"><label class="f">Naar bed<input class="in" type="time" id="sl-bed" value="${h.bed || sc.bed}"></label><label class="f">Wakker<input class="in" type="time" id="sl-wake" value="${h.wake || sc.wake}"></label></div>
      <p class="muted small" style="margin:0">Doel: ${hmin(sleepGoal())}. Je vaste tijden pas je aan bij Profiel → Doelen.</p>
      <button class="btn cta wide plain" data-act="sleep-save">Opslaan</button>`;
  } else if (S.sheet.type === 'switch') {
    title = 'Wie traint er?';
    body = USERS.map((u) => `<button class="pick" data-act="switch-to" data-u="${u.id}"><span class="row">${faceHtml(u, 36)}<b>${esc(u.name)}</b></span>${u.id === S.me ? '<small>actief</small>' : ''}</button>`).join('');
  }
  root.innerHTML = `<div class="sheet" data-act="sheet-close"><div class="sheet-in" role="dialog" aria-label="${title}" data-stop>${head(title)}<div class="sheet-body">${body}</div></div></div>`;
}

// ---------- Events ----------
const armed = new WeakMap();
const cur = () => draft?.ex[draft.cur];
document.addEventListener('pointerdown', (ev) => { const b = ev.target.closest('.btn, .pbtn, .pill-cta, .addline'); if (!b) return; const r = b.getBoundingClientRect(); b.style.setProperty('--rx', ev.clientX - r.left + 'px'); b.style.setProperty('--ry', ev.clientY - r.top + 'px'); }, { passive: true });
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-act],[data-tab]');
  if (!t || t.disabled) return;
  if (t.dataset.tab) {
    if (t.dataset.tab === 'train') { S.sheet = { type: 'plus' }; renderSheet(); return; }
    go(t.dataset.tab); return;
  }
  const act = t.dataset.act;
  if (act === 'sheet-close' && ev.target.closest('[data-stop]') && !ev.target.closest('.iconbtn')) return;
  if (act === 'wheel-cancel' && ev.target.closest('[data-stop]')) return;
  if (act === 'modal-close' && ev.target.closest('[data-stop]') && !t.closest('.lb__x') && !t.matches('.btn')) return;
  if (t.hasAttribute('data-confirm') && !armed.get(t)) {
    armed.set(t, t.textContent); t.textContent = 'Zeker weten?'; t.classList.add('armed');
    setTimeout(() => { if (t.isConnected && armed.get(t)) { t.textContent = armed.get(t); armed.delete(t); t.classList.remove('armed'); } }, 3000);
    return;
  }
  switch (act) {
    case 'welcome-pick': S.welcomePick = t.dataset.u; render(); break;
    case 'welcome-start': S.me = t.dataset.u; ls.set('ijzer:me', S.me); draft = ls.get(draftKey(), null); go('home'); break;
    case 'welcome-go': S.me = S.welcomePick || 'antonie'; ls.set('ijzer:me', S.me); draft = ls.get(draftKey(), null); go('home'); break;
    case 'logout': S.me = null; ls.del('ijzer:me'); S.stack = []; S.route = { name: 'home' }; render(); break;
    case 'switch-sheet': S.sheet = { type: 'switch' }; renderSheet(); break;
    case 'switch-user': case 'switch-to': {
      const to = act === 'switch-user' ? other().id : t.dataset.u;
      if (to !== S.me) { saveDraft(); S.me = to; ls.set('ijzer:me', S.me); draft = ls.get(draftKey(), null); rest = null; toast(`Je bent nu ${userOf(S.me).name}.`); }
      S.sheet = null; go(ROOT.includes(S.route.name) ? S.route.name : 'home'); break;
    }
    case 'open-search': t.blur?.(); openModal({ type: 'search', q: '', kind: 'all', level: null, group: null }); break;
    case 'modal-close': { const wasEx = S.modal?.type === 'exedit'; closeModal(); if (wasEx) render(); break; }
    case 'ee-open': openModal({ type: 'exedit', i: +t.dataset.i }); break;
    case 'ee-add-set': { const e = exArr()[S.modal.i]; const l = e.sets[e.sets.length - 1]; e.sets.push({ kg: l?.kg ?? '', reps: '', done: false }); saveEx(); renderModal(); $(`#ee-reps-${e.sets.length - 1}`)?.focus(); break; }
    case 'ee-del-set': { const e = exArr()[S.modal.i]; e.sets.splice(+t.dataset.si, 1); saveEx(); renderModal(); break; }
    case 'ee-del-ex': exArr().splice(S.modal.i, 1); saveEx(); closeModal(); render(); break;
    case 'edit-cancel': draft = null; saveDraft(); back(); break;
    case 'lb-kind': S.modal.kind = t.dataset.k; renderModal(); break;
    case 'lb-level': S.modal.level = +t.dataset.l < 0 ? null : +t.dataset.l; renderModal(); break;
    case 'lb-group': S.modal.group = S.modal.group === t.dataset.g ? null : t.dataset.g; renderModal(); break;
    case 'lb-open-tpl': closeModal(); S.plan = { day: todayStr(), time: '07:00' }; S.pickM = null; go('detail', { id: t.dataset.id }); break;
    case 'lb-open-ex': closeModal(); S.progEx = t.dataset.id; S.who = 'me'; go('progress'); break;
    case 'b-clear': S.browse.level = null; S.browse.group = null; render(); break;
    case 'cal-prev': S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } render(); break;
    case 'cal-next': S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } render(); break;
    case 'cal-view': S.cal.view = t.dataset.v; render(); break;
    case 'cal-day': {
      const users = USERS.map((u) => u.id);
      const ws = dedupPairs(S.data.workouts.filter((w) => w.date === t.dataset.d && (users.includes(w.user) || (users.includes(w.partner) && !w.pair))));
      openModal(ws.length === 1 ? { type: 'workout', id: ws[0].id } : { type: 'day', d: t.dataset.d }); break;
    }
    case 'w-open': openModal({ type: 'workout', id: t.dataset.id }); break;
    case 'w-more': closeModal(); go('workout', { id: t.dataset.id }); break;
    case 'log-on': closeModal(); S.log.date = t.dataset.d; S.log.tpl = S.log.tpl ?? nextTpl(S.me).id; go('log'); break;
    case 'partner': draft.partner = t.dataset.v; saveDraft(); render(); break;
    case 'log-partner': S.log.partner = t.dataset.v; S.log.date = $('#log-date').value; S.log.time = $('#log-time').value; S.log.dur = $('#log-dur').value; S.log.kcal = $('#log-kcal').value; render(); break;
    case 'go': if (t.dataset.r === 'log') { S.log.date = S.log.date || todayStr(); S.log.tpl = S.log.tpl ?? nextTpl(S.me).id; } go(t.dataset.r); break;
    case 'photo': S.photoSlot = t.dataset.slot; $('#photo-in').value = ''; $('#photo-in').click(); break;
    case 'photo-del': await Store.del('photos', t.dataset.slot); render(); break;
    case 'log-tpl': S.log.tpl = t.dataset.id; S.log.date = $('#log-date').value; S.log.time = $('#log-time').value; S.log.dur = $('#log-dur').value; S.log.kcal = $('#log-kcal').value; render(); break;
    case 'log-go': {
      if (draft) { toast('Rond eerst je lopende training af.'); break; }
      const L = S.log; L.date = $('#log-date').value || todayStr(); L.time = $('#log-time').value || '07:00'; L.dur = $('#log-dur').value; L.kcal = $('#log-kcal').value;
      if (L.date > todayStr()) { toast('Die datum ligt in de toekomst. Plan hem liever in.'); break; }
      const tp = L.tpl ? tplById(L.tpl) : null;
      const [hh, mi] = L.time.split(':').map(Number);
      draft = { id: uid(), manual: true, partner: L.partner || '', user: S.me, tpl: tp?.id || 'custom', name: tp ? tp.name : 'Eigen training', date: L.date, start: parseDate(L.date) + ((hh || 0) * 60 + (mi || 0)) * 60000,
        dur: L.dur || String(tp ? tplMeta(tp).min : 45), kcal: L.kcal, note: '', ex: [], cur: 0, pausedMs: 0 };
      for (const id of tp?.ex || []) addExToDraft(id);
      saveDraft(); S.log = { tpl: null, date: null, time: '07:00', dur: '', kcal: '', partner: '' }; go('active', {}, { replace: true }); break;
    }
    case 'fill-last': {
      const e = cur(); const last = lastSession(S.me, e.id, draft.editing);
      e.sets.forEach((x, si) => { if (x.done) return; const ph = placeholder(e, si, last); if (x.kg === '' && ph.kg !== '') x.kg = String(ph.kg); if (x.reps === '' && ph.reps !== '') x.reps = String(ph.reps); if (x.reps !== '') x.done = true; });
      saveDraft(); render(); break;
    }
    case 'back': back(); break;
    case 'go-filter': S.browse.showFilter = true; go('browse'); break;
    case 'detail': closeModal(); if (t.dataset.id) { S.plan = { day: todayStr(), time: '07:00' }; S.pickM = null; go('detail', { id: t.dataset.id }); } break;
    case 'resume': S.sheet = null; go('active'); break;
    case 'timer-mode': S.noTimer = t.dataset.v === 'off'; ls.set('brndfit:notimer', S.noTimer); renderSheet(); break;
    case 'timer-off': { if (!draft) break; draft.dur = String(Math.max(1, Math.round(elapsed() / 60000))); draft.manual = true; draft.noTimer = true; stopRest(); saveDraft(); render(); toast('Timer uit. Vul gewoon je sets in.'); break; }
    case 'start': S.sheet = null; if (t.dataset.tpl === 'padel') { startPadel({ time: t.dataset.time }); break; } startWorkout(t.dataset.tpl, null, null, t.dataset.plan); break;
    case 'padel-new': S.sheet = null; startPadel(); break;
    case 'more': S.more[t.dataset.k] = !S.more[t.dataset.k]; render(); break;
    case 'tdot': { const c = $('#tcar'); c?.scrollTo({ left: +t.dataset.i * (c.firstElementChild.offsetWidth + 10), behavior: 'smooth' }); break; }
    case 'add-open': openAdd(t.dataset.k || 'fitness', t.dataset.mode || null); break;
    case 'add-mode': S.add.mode = t.dataset.v; render(); break;
    case 'add-kind': S.add.kind = t.dataset.v; render(); break;
    case 'add-next': {
      const A = S.add;
      if (A.mode === 'log') {
        if (A.kind === 'padel') { startPadel(); break; }
        if (draft) { toast('Rond eerst je lopende training af.'); break; }
        S.log = { tpl: nextTpl(S.me).id, date: todayStr(), time: DEFAULT_TIME, dur: '', kcal: '', partner: '' }; go('log'); break;
      }
      S.planf = { kind: A.kind, tpl: A.kind === 'padel' ? 'padel' : nextTpl(S.me).id, day: todayStr(), time: DEFAULT_TIME, partner: A.kind === 'padel' ? other().id : '' }; S.pickM = null; go('planform'); break;
    }
    case 'pf-tpl': S.planf.tpl = t.dataset.id; render(); break;
    case 'plan-partner': S.plan.partner = t.dataset.v; render(); break;
    case 'pf-partner': S.planf.partner = t.dataset.v; render(); break;
    case 'pf-day': S.planf.day = t.dataset.d; S.pickM.sel = t.dataset.d; render(); break;
    case 'pm-prev': S.pickM.m--; if (S.pickM.m < 0) { S.pickM.m = 11; S.pickM.y--; } S.pickM.auto = false; render(); break;
    case 'pm-next': S.pickM.m++; if (S.pickM.m > 11) { S.pickM.m = 0; S.pickM.y++; } S.pickM.auto = false; render(); break;
    case 'pf-time': S.planf.time = t.dataset.t; render(); break;
    case 'pf-save': {
      const F = S.planf; const pl = { user: F.user || S.me, tpl: F.tpl, date: F.day, time: F.time, partner: F.partner || '' };
      if (await Store.put('plans', F.id || uid(), pl)) { toast(F.id ? `Aangepast: ${relDay(pl.date).toLowerCase()} om ${pl.time}.` : `Ingepland: ${relDay(pl.date).toLowerCase()} om ${pl.time}.`); S.planf = null; S.add = null; go('home'); }
      break;
    }
    case 'padel-plan': S.sheet = null; S.plan = { day: todayStr(), time: '07:00' }; S.pickM = null; go('detail', { id: 'padel' }); break;
    case 'pd-partner': readPadel(); S.padel.partner = t.dataset.v; render(); break;
    case 'pd-int': readPadel(); S.padel.intensity = t.dataset.v; render(); break;
    case 'pd-res': readPadel(); S.padel.result = S.padel.result === t.dataset.v ? '' : t.dataset.v; render(); break;
    case 'pd-save': await savePadel(); break;
    case 'fav': {
      ev.stopPropagation();
      const p = profile(); const f = new Set(p.favs || []); f.has(t.dataset.id) ? f.delete(t.dataset.id) : f.add(t.dataset.id);
      const np = { ...p, favs: [...f] }; delete np.id;
      if (await Store.put('profiles', S.me, np)) { S.data.profiles = [...S.data.profiles.filter((x) => x.id !== S.me), { ...np, id: S.me }]; render(); }
      break;
    }
    // Ontdek
    case 'b-tab': S.browse.tab = t.dataset.k; render(); break;
    case 'b-filter': openModal({ type: 'bfilter' }); break;
    case 'b-sort': S.browse.sort = { pop: 'min', min: 'name', name: 'pop' }[S.browse.sort]; render(); break;
    case 'b-level': S.browse.level = +t.dataset.l < 0 ? null : +t.dataset.l; render(); break;
    case 'b-group': S.browse.group = S.browse.group === t.dataset.g ? null : t.dataset.g; render(); break;
    case 'ex-progress': S.progEx = t.dataset.id; S.who = 'me'; go('progress'); break;
    case 'new-ex-sheet': S.sheet = { type: 'ex', q: '', standalone: true }; renderSheet(); break;
    // Plannen
    case 'plan-day': S.plan.day = t.dataset.d; S.pickM.sel = t.dataset.d; render(); break;
    case 'plan-time': S.plan.time = S.plan.time === t.dataset.t ? null : t.dataset.t; render(); break;
    case 'plan-save': {
      const pl = { user: S.me, tpl: t.dataset.id, date: S.plan.day, time: S.plan.time, partner: S.plan.partner ?? (tplById(t.dataset.id)?.sport ? other().id : '') };
      if (await Store.put('plans', uid(), pl)) { toast(`Ingepland: ${relDay(pl.date).toLowerCase()} om ${pl.time}.`); S.plan.time = '07:00'; render(); }
      break;
    }
    case 'join-plan': { closeModal();
      const o = S.data.plans.find((x) => x.id === t.dataset.id); if (!o) break;
      if (await Store.put('plans', uid(), { user: S.me, tpl: o.tpl, date: o.date, time: o.time })) { toast(`Je traint mee met ${userOf(o.user).name}.`); render(); }
      break;
    }
    case 'del-plan': await Store.del('plans', t.dataset.id); closeModal(); if (S.route.name === 'planform') { S.planf = null; toast('Planning verwijderd.'); go('home'); } else render(); break;
    case 'plan-open': {
      const pl = S.data.plans.find((x) => x.id === t.dataset.id); if (!pl) break;
      if (!canEditPl(pl)) { openModal({ type: 'plan', id: pl.id }); break; }
      closeModal(); go('detail', { id: pl.tpl, plan: pl.id }); break;
    }
    case 'plan-time-edit': {
      const pl = S.data.plans.find((x) => x.id === t.dataset.id); if (!pl) break;
      S.planf = { id: pl.id, user: pl.user, kind: tplById(pl.tpl)?.sport ? 'padel' : 'fitness', tpl: pl.tpl, day: pl.date, time: pl.time, partner: pl.partner || '' }; S.pickM = null; go('planform'); break;
    }
    case 'planex': { const pl = S.data.plans.find((x) => x.id === t.dataset.id); if (!pl) break; S.pex = { id: pl.id, tpl: pl.tpl, ex: JSON.parse(JSON.stringify(planExList(pl, tplById(pl.tpl)))) }; go('planex'); break; }
    case 'pex-save': {
      const pl = S.data.plans.find((x) => x.id === S.pex.id); if (!pl) { back(); break; }
      const ex = S.pex.ex.map((e) => ({ id: e.id, name: e.name, group: e.group, kind: e.kind, sets: e.sets.map((x) => ({ kg: num(x.kg) ?? '', reps: num(x.reps) ?? '' })) }));
      const doc = { ...pl, ex }; delete doc.id;
      if (await Store.put('plans', pl.id, doc)) { toast('Oefeningen opgeslagen.'); S.pex = null; back(); }
      break;
    }
    case 'menu': S.sheet = { type: 'menu' }; renderSheet(); break;
    case 'day-pick': S.sheet = { type: 'day' }; renderSheet(); break;
    case 'day-set': S.day = t.dataset.d === todayStr() ? null : t.dataset.d; S.sheet = null; render(); break;
    case 'steps': S.sheet = { type: 'steps' }; renderSheet(); setTimeout(() => $('#steps-in')?.focus(), 60); break;
    case 'sleep': S.sheet = { type: 'sleep' }; renderSheet(); break;
    case 'sleep-save': {
      const d = S.day || todayStr();
      if (await saveSleep(d, $('#sl-bed').value || '23:00', $('#sl-wake').value || '07:00')) { S.sheet = null; render(); toast('Slaap opgeslagen.'); }
      break;
    }
    case 'sleep-ok': { const sc = sleepSched(); if (await saveSleep(todayStr(), sc.bed, sc.wake)) { render(); toast(`${hmin(sc.min)} slaap opgeslagen.`); } break; }
    case 'hk-new': { const tok = await SB.makeToken(S.me); if (tok) { S.healthToken = tok; const p = { ...profile(), hkToken: tok }; delete p.id; await Store.put('profiles', S.me, p); render(); toast('Koppelcode gemaakt.'); } break; }
    case 'copy': try { await navigator.clipboard.writeText(t.dataset.v); toast('Gekopieerd.'); } catch { toast('Kopiëren lukt hier niet, houd de tekst ingedrukt om te kopiëren.'); } break;
    case 'login-again': S.loginSent = null; render(); break;
    case 'login-mode': S.loginNew = !S.loginNew; render(); break;
    case 'sb-logout': await SB.client.auth.signOut(); break;
    case 'steps-save': {
      const d = S.day || todayStr(); const v = Math.max(0, Math.round(num($('#steps-in').value) || 0));
      const old = healthOf(S.me, d) || {};
      if (await Store.put('health', S.me + '_' + d, { ...old, user: S.me, date: d, steps: v, source: old.source === 'apple' ? 'apple' : 'manual' })) { S.sheet = null; render(); toast('Stappen opgeslagen.'); }
      break;
    }
    case 'del-tpl': await Store.del('templates', t.dataset.id); back(); break;
    // Doelspieren
    case 'm-all': S.muscles.sel = [...GROUP_ORDER]; render(); break;
    case 'm-focus': S.muscles.sel = S.muscles.sel.length === GROUP_ORDER.length ? [] : S.muscles.sel; render(); break;
    case 'm-toggle': { const s = new Set(S.muscles.sel); s.has(t.dataset.g) ? s.delete(t.dataset.g) : s.add(t.dataset.g); S.muscles.sel = GROUP_ORDER.filter((g) => s.has(g)); render(); break; }
    case 'm-go': { const sel = S.muscles.sel; startWorkout('', musclesExercises(sel), 'Eigen: ' + sel.map((g) => GROUPS[g]).join(' + ')); break; }
    case 'ready-skip': clearInterval(readyT); readyT = null; go('active', {}, { replace: true }); break;
    // Trainen
    case 'pause':
      if (draft.paused) { draft.pausedMs = (draft.pausedMs || 0) + Date.now() - draft.paused; draft.paused = null; } else draft.paused = Date.now();
      saveDraft(); render(); break;
    case 'tick': {
      const row = t.closest('.set'); const e = draft.ex[+row.dataset.ei]; const si = +row.dataset.si; const s = e.sets[si];
      if (!s.done) { const ph = placeholder(e, si, lastSession(S.me, e.id, draft.editing)); if (s.kg === '' && ph.kg !== '') s.kg = String(ph.kg); if (s.reps === '' && ph.reps !== '') s.reps = String(ph.reps); }
      if (!s.done && s.reps === '') { toast('Vul je reps in.'); $(`#reps-${row.dataset.ei}-${si}`)?.focus(); break; }
      s.done = !s.done; if (s.done) S.pop = [row.dataset.ei, row.dataset.si];
      if (s.done && !draft.manual && !draft.editing) startRest(e.kind === 'kg' && ['legs', 'back', 'chest'].includes(e.group) ? 120 : 90); else stopRest();
      saveDraft(); render(); break;
    }
    case 'add-set': cur().sets.push({ kg: '', reps: '', done: false }); saveDraft(); render(); break;
    case 'del-set': cur().sets.pop(); saveDraft(); render(); break;
    case 'ex-prev': draft.cur = Math.max(0, draft.cur - 1); saveDraft(); S.scrollTop = true; render(); break;
    case 'ex-next': draft.cur = Math.min(draft.ex.length - 1, draft.cur + 1); saveDraft(); S.scrollTop = true; render(); break;
    case 'ex-g': S.sheet.g = t.dataset.g; renderExSheet(); break;
    case 'sc-toggle': { const i = +t.dataset.i; S.scOpen = S.scOpen === i ? null : i; render(); break; }
    case 'sc-open': draft.cur = +t.dataset.i; openModal({ type: 'exset', i: +t.dataset.i }); break;
    case 'ss-tick': { const e = draft.ex[S.modal.i]; const si = +t.dataset.si; const s = e.sets[si];
      if (s.done) { s.done = false; } else { const ph = placeholder(e, si, lastSession(draft.user || S.me, e.id, draft.editing || draft.id)); if (s.kg === '' && ph.kg !== '') s.kg = String(ph.kg); if (s.reps === '' && ph.reps !== '') s.reps = String(ph.reps);
        if (s.reps === '') { openWheel(si); break; } s.done = true; try { navigator.vibrate?.(12); } catch { /* */ } }
      saveDraft(); render(); break; }
    case 'ss-wheel': openWheel(+t.dataset.si); break;
    case 'wheel-cancel': closeWheel(); break;
    case 'wheel-ok': { const W = S.wheel; if (!W) break; const e = draft.ex[W.i]; const s = e.sets[W.si];
      const kg = wheelValue('wh-kg', wheelVals(e.kind, 'kg')); const reps = wheelValue('wh-reps', wheelVals(e.kind, 'reps'));
      if (kg != null) s.kg = String(kg); if (reps != null) s.reps = String(reps); s.done = true;
      closeWheel(); saveDraft(); render(); break; }
    case 'ss-add': { const e = draft.ex[S.modal.i]; const p = e.sets[e.sets.length - 1]; e.sets.push({ kg: p?.kg ?? '', reps: p?.reps ?? '', done: false }); saveDraft(); render(); break; }
    case 'ss-del': { const e = draft.ex[S.modal.i]; if (e.sets.length > 1) e.sets.pop(); saveDraft(); render(); break; }
    case 'sess-menu': S.sheet = { type: 'sessmenu' }; renderSheet(); break;
    case 'scal': { const C = S.scal; C.m += +t.dataset.d; if (C.m < 0) { C.m = 11; C.y--; } if (C.m > 11) { C.m = 0; C.y++; } render(); break; }
    case 'body-save': { const mk = wheelValue('bw-mus', BODY_MUS), fp = wheelValue('bw-fat', BODY_FAT); const m = { user: S.me, date: todayStr(), muscle: mk, fat: fp };
      const ex = bodyOf().find((x) => x.date === todayStr()); const id = ex?.id || uid(); const clean = { ...(ex || {}), ...m }; delete clean.id;
      if (await Store.put('body', id, clean)) { toast('Opgeslagen.'); render(); } break; }
    case 'ex-sum': S.actSum = true; stopRest(); S.scrollTop = true; render(); break;
    case 'sum-close': S.actSum = false; S.scrollTop = true; render(); break;
    case 'swap-i': draft.cur = +t.dataset.i; saveDraft(); S.sheet = { type: 'ex', q: '', g: draft.ex[draft.cur]?.group || '', swap: true }; renderSheet(); break;
    case 'del-i': draft.ex.splice(+t.dataset.i, 1); draft.cur = Math.min(draft.cur || 0, Math.max(0, draft.ex.length - 1)); saveDraft(); render(); break;
    case 'ex-go': S.actSum = false; draft.cur = +t.dataset.i; saveDraft(); S.scrollTop = true; render(); break;
    case 'ex-menu': S.sheet = { type: 'exmenu' }; renderSheet(); break;
    case 'ex-del': draft.ex.splice(draft.cur, 1); draft.cur = Math.max(0, Math.min(draft.cur, draft.ex.length - 1)); S.sheet = null; saveDraft(); render(); break;
    case 'swap-ex': S.sheet = { type: 'ex', q: '', g: cur()?.group || '', swap: true }; renderSheet(); break;
    case 'pick-ex': S.sheet = { type: 'ex', q: '' }; renderSheet(); setTimeout(() => $('#ex-search')?.focus(), 50); break;
    case 'sheet-close': S.sheet = null; renderSheet(); break;
    case 'add-ex': {
      if (S.sheet?.standalone) { S.sheet = null; renderSheet(); break; }
      if (S.route.name === 'planex') { const e = exById(t.dataset.id); S.sheet = null; if (e) { const l = lastSession(S.me, e.id); S.pex.ex.push({ id: e.id, name: e.name, group: e.group, kind: e.kind, sets: (l?.sets || [{}, {}, {}]).map((x) => ({ kg: x.kg ?? '', reps: x.reps ?? '' })) }); } render(); openModal({ type: 'exedit', i: S.pex.ex.length - 1 }); break; }
      const swap = S.sheet?.swap; S.sheet = null;
      if (swap) { const i = draft.cur; addExToDraft(t.dataset.id); const n = draft.ex.pop(); draft.ex[i] = n; }
      else { addExToDraft(t.dataset.id); draft.cur = draft.ex.length - 1; S.actSum = false; }
      saveDraft(); S.scrollTop = !draft.editing; render(); if (draft.editing && !swap) openModal({ type: 'exedit', i: draft.ex.length - 1 }); break;
    }
    case 'new-ex': {
      const name = $('#new-ex-name').value.trim(); if (!name) { toast('Geef de oefening een naam.'); break; }
      const id = 'x-' + uid(); const ex = { name, group: $('#new-ex-group').value, kind: $('#new-ex-kind').value };
      if (!(await Store.put('exercises', id, ex))) break;
      S.data.exercises = [...S.data.exercises.filter((e) => e.id !== id), { ...ex, id }];
      if (draft && !S.sheet?.standalone) { addExToDraft(id); draft.cur = draft.ex.length - 1; saveDraft(); }
      S.sheet = null; render(); toast(`${name} toegevoegd.`); break;
    }
    case 'finish': S.sheet = null; S.actSum = false; await finishWorkout(); break;
    case 'discard': { const was = draft?.editing ? 'Bewerken gestopt.' : 'Training geannuleerd.'; draft = null; saveDraft(); rest = null; S.sheet = null; go('home'); toast(was); break; }
    case 'rest': if (rest) { rest.end += +t.dataset.d * 1000; rest.total = Math.max(rest.total, (rest.end - Date.now()) / 1000); } break;
    case 'rest-stop': stopRest(); break;
    // Klaar
    case 'done-close': {
      const note = ($('#done-note')?.value || '').trim();
      if (note !== S.done.w.note) await Store.put('workouts', S.done.id, { ...S.done.w, note });
      S.done = null; go('home'); break;
    }
    // Voortgang & profiel
    case 'together': S.who = S.who === 'both' ? 'me' : 'both'; render(); break;
    case 'whoset': S[t.dataset.key] = t.dataset.v; render(); break;
    case 'who': S.who = t.dataset.v === 'both' ? 'both' : t.dataset.v === S.me ? 'me' : 'other'; render(); break;
    case 'together-go': S.who = 'both'; go('progress'); break;
    case 'metric': S.progMetric = t.dataset.m; render(); break;
    case 'both': S.bodyBoth = !S.bodyBoth; render(); break;
    case 'del-w': await Store.del('workouts', t.dataset.id); if (S.route.name === 'padel') { S.padel = null; go('progress'); } else if (S.route.name === 'workout') back(); else render(); toast('Training verwijderd.'); break;
    case 'edit-w': {
      if (draft) { toast('Rond eerst je lopende training af.'); break; }
      const w = S.data.workouts.find((x) => x.id === t.dataset.id); if (!w) break;
      if (!canEditW(w)) { toast('Alleen wie meedeed kan deze training aanpassen.'); break; }
      if (w.sport) { startPadel({ id: w.id }); break; }
      draft = { id: w.id, editing: w.id, user: w.user, tpl: w.tpl, name: w.name, date: w.date, start: w.start, end: w.end, note: w.note || '', cur: 0, pausedMs: 0, dur: String(durMin(w) || ''), kcal: w.kcal ? String(w.kcal) : '', partner: w.partner || '',
        ex: w.ex.map((e) => ({ ...e, sets: e.sets.length ? e.sets.map((s) => ({ kg: e.kind === 'time' ? '' : String(s.kg ?? ''), reps: String(s.reps ?? ''), done: true })) : Array.from({ length: e.n || 3 }, () => ({ kg: '', reps: '', done: false })) })) };
      S.scOpen = null; saveDraft(); go('active'); break;
    }
    case 'add-m': {
      const m = { user: S.me, date: $('#m-date').value || todayStr() }; let any = false;
      for (const k of ['weight', 'fat', 'muscle', 'waist', 'chest', 'arm', 'thigh']) { const v = num($('#m-' + k).value); if (v != null) { m[k] = v; any = true; } }
      if (!any) { toast('Vul minstens één waarde in.'); break; }
      if (await Store.put('body', uid(), m)) { render(); toast('Meting opgeslagen.'); }
      break;
    }
    case 'del-m': await Store.del('body', t.dataset.id); render(); break;
    case 'save-p': {
      const p = { ...profile(), height: num($('#p-height').value), birthYear: num($('#p-birth').value), goalWeight: num($('#p-goal').value), weekly: Math.max(1, Math.min(7, num($('#p-weekly').value) || 3)), sex: $('#p-sex').value, bio: $('#p-bio').value.trim() };
      if ($('#p-sleep')) p.sleepGoal = Math.max(4, Math.min(12, num($('#p-sleep').value) || 8));
      if ($('#p-bed')?.value) p.bedTime = $('#p-bed').value;
      if ($('#p-wake')?.value) p.wakeTime = $('#p-wake').value;
      if ($('#p-steps')) p.stepGoal = Math.max(1000, Math.min(40000, num($('#p-steps').value) || 10000));
      delete p.id;
      if (await Store.put('profiles', S.me, p)) { S.data.profiles = [...S.data.profiles.filter((x) => x.id !== S.me), { ...p, id: S.me }]; toast('Opgeslagen.'); render(); }
      break;
    }
  }
});
document.addEventListener('submit', async (ev) => {
  if (ev.target.dataset.form === 'login') { ev.preventDefault(); const em = $('#login-email').value.trim(); ls.set('brndfit:email', em); const err = await SB.login(em); if (err) toast(err.includes('rate') ? 'Even wachten: je kunt maar een paar mails per uur aanvragen.' : err); else { S.loginSent = em; render(); setTimeout(() => $('#login-code')?.focus(), 50); } return; }
  if (ev.target.dataset.form === 'pw') {
    ev.preventDefault(); const em = $('#login-email').value.trim(); ls.set('brndfit:email', em);
    const err = await SB.password(em, $('#login-pw').value, !!S.loginNew);
    if (!err) { location.reload(); return; }
    if (err === 'confirm') { toast('Account gemaakt, maar Supabase wil eerst een bevestiging per mail. Zet "Confirm email" uit (zie uitleg) en log daarna in.'); S.loginNew = false; render(); return; }
    toast(/invalid/i.test(err) ? 'E-mail of wachtwoord klopt niet.' : /registered|exists/i.test(err) ? 'Dit e-mailadres heeft al een account. Log in.' : /rate/i.test(err) ? 'Even wachten en opnieuw proberen.' : err);
    return;
  }
  if (ev.target.dataset.form === 'otp') { ev.preventDefault(); const code = $('#login-code').value.replace(/\D/g, ''); const err = await SB.verify(S.loginSent, code); if (err) toast('Die code klopt niet of is verlopen. Vraag een nieuwe aan.'); else location.reload(); return; }
  if (ev.target.dataset.form === 'search') { ev.preventDefault(); S.browse.q = $('#home-q').value.trim(); S.browse.tab = 'all'; go('browse'); }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'ex-search') { S.sheet.q = t.value; const pos = t.selectionStart; renderExSheet(); const n = $('#ex-search'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === 'lb-q') { S.modal.q = t.value; const pos = t.selectionStart; renderModal(); const n = $('#lb-q'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === 'b-q') { S.browse.q = t.value; const pos = t.selectionStart; doRender(); const n = $('#b-q'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.dataset.eeF && S.modal?.type === 'exedit') { const st = exArr()[S.modal.i].sets[+t.dataset.si]; st[t.dataset.eeF] = t.value.replace(',', '.'); st.done = st.reps !== ''; saveEx(); return; }
  if (!draft) return;
  if (t.dataset.draft) { draft[t.dataset.draft] = t.value; saveDraft(); return; }
  const row = t.closest('.set'); if (!row || !t.dataset.f) return;
  draft.ex[+row.dataset.ei].sets[+row.dataset.si][t.dataset.f] = t.value.replace(',', '.'); saveDraft();
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'pf-custom' && ev.target.value && S.planf) { S.planf.time = ev.target.value; render(); return; } if (ev.target.id === 'prog-ex') { S.progEx = ev.target.value; render(); } if (ev.target.id === 'photo-in' && S.photoSlot) setPhoto(S.photoSlot, ev.target.files?.[0]); });
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && S.modal) { closeModal(); return; }
  if (ev.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(); }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"]')) { ev.preventDefault(); ev.target.click(); }
});

runIntro();
render();
Store.init();
initAssets();
</script>

</body></html>
